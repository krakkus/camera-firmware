<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · {{ device_name }}</title>
<style>
  body { margin:0; background:#111; color:#ccc; font-family:sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  form { background:#181818; border:1px solid #333; border-radius:6px; padding:24px; width:min(340px, calc(100vw - 32px)); box-sizing:border-box; }
  h1 { margin:0 0 4px; font-size:18px; color:#ddd; }
  p { margin:0 0 16px; font-size:13px; color:#777; }
  label { display:block; font-size:12px; color:#999; margin-bottom:4px; }
  input { width:100%; box-sizing:border-box; background:#2a2a2a; color:#ccc; border:1px solid #444; border-radius:4px; padding:8px; font-size:15px; }
  button { margin-top:14px; width:100%; background:#1f5f2c; border:1px solid #2f8a41; color:#e6ffe9; padding:8px; border-radius:4px; font-size:15px; cursor:pointer; }
  .err { color:#e66; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>{{ device_name }}</h1>
  <p>Enter the device token. It is in config.json, or ask whoever set up this camera.</p>
  <label for="token">Token</label>
  <input type="password" id="token" name="token" autocomplete="current-password" autofocus required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log in</button>
  {% if error %}<div class="err">Wrong token.</div>{% endif %}
</form>
</body>
</html>
